services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tro
      POSTGRES_PASSWORD: tro
      POSTGRES_USER: tro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tro -d tro"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BUSINESS_TIMEZONE: Asia/Bangkok
      DATABASE_URL: postgresql://tro:tro@postgres:5432/tro
      NODE_ENV: production
      PORT: 4000
      RECEIPT_PREVIEW_SECRET: change-me-local-receipt-secret
      SESSION_SECRET: change-me-local-session-secret
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "3000:80"

volumes:
  postgres-data:
